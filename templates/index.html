<!DOCTYPE html>
<html>
<head>
    <title>Web Vulnerability Scanner</title>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #38bdf8;
        }

        input {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background-color: #38bdf8;
            border: none;
            border-radius: 5px;
            color: black;
            cursor: pointer;
        }

        .card {
            padding: 15px;
            margin: 10px auto;
            width: 300px;
            border-radius: 8px;
        }

        .high {
            background-color: #7f1d1d;
            color: #fca5a5;
        }

        .low {
            background-color: #78350f;
            color: #fcd34d;
        }

        .info {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Web Vulnerability Scanner</h1>

    <form method="POST">
        <input type="text" name="url" placeholder="Enter URL" required>
        <br><br>
        <button type="submit">Scan</button>
    </form>

    <h2>Results:</h2>

    {% if results %}
        {% for r in results %}
            <div class="card 
                {% if 'High' in r %} high 
                {% elif 'Low' in r %} low 
                {% else %} info {% endif %}">
                {{ r }}
            </div>
        {% endfor %}
    {% endif %}

</body>
</html>
